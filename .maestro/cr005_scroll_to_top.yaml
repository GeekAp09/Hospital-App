# CR-005: "Back to top" button on the Find a Doctor list
appId: com.mobile360.healthcare
---
- launchApp
- tapOn: "Mobile phone number"
- inputText: "9876543210"
- tapOn: "Send code"
- tapOn: "Enter 6-digit code"
- inputText: "123456"
- tapOn: "Confirm"
- tapOn: "Care Services"
- assertVisible: "Find a Doctor"
- assertNotVisible: "Back to top"
- scroll
- scroll
- assertVisible: "Back to top"
- tapOn: "Back to top"
- assertNotVisible: "Back to top"
- assertVisible: "Find a Doctor"
